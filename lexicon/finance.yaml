# Plain words used to split run-together enum values (CREDITCARD -> credit card).
vocabulary:
  [home, equity, money, market, credit, card, line, of, loan, savings, saving, checking, personal,
   student, auto, mortgage, military, installment, deposit, certificate, escrow, brokerage, product,
   retirement, digital, wallet, annuity, insurance, commercial, business, consumer, investment,
   charge, high, interest, first, other, pending, open, close, closed, power, attorney, joint,
   primary, secondary, payment, payoff, lump, sum, skip, double, up, withdrawal, purchase, fee,
   adjustment, check, transfer, account, sole, owner, trust, trustee, minor, uniform, borrower,
   tenant, authorized, signer, user, benefit, restricted, negative, current, balance, paid,
   delinquent, cash, value, fixed, variable, indexed, daily, weekly, monthly, annually]

