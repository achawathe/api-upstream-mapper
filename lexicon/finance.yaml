  - [closing, last, 0.6]
  - [due, payment, 0.6]
  - [type, code, 0.5]
  - [rate, interest, 0.7]
  - [sub, detailed, 0.6]
  - [from, start, 0.8]
  - [to, end, 0.8]

# Leaf names too vague to identify a field alone; the parent name is weighed fully with them.
generic:
  [identifier, number, amount, value, code, name, type, status, date, timestamp,
   description, indicator, flag, text, label, address, display]

# Concepts that carry little meaning when unmatched (their weight is reduced).
weak: [amount, value, indicator, flag, total, percent]

# Words dropped entirely.
stopwords:
  [the, of, a, an, and, for, by, with, data, info, information, detail, details, obj,
   object, dto, response, resp, result, results, item, items, record, records, payload,
   body, v, api, list, is, has, collection, wrapper, root, entity, entities, model, resource]

# Account-kind qualifiers. Fields in opposing families must not map to each other
# (a debit account id is never a credit account id).
qualifier_families:
  deposit: [deposit, debit, checking, savings, moneymarket]
  credit: [credit, card, loc, revolving, heloc]
  loan: [loan, lending, mortgage, installment, lend, borrowing]
  investment: [investment, brokerage, securities, portfolio, wealth, holding]
  insurance: [insurance, policy]
  annuity: [annuity]
  commercial: [commercial]
  wallet: [wallet]

# Words that turn a field into "some other" thing: fromAccountId is not accountId.
role_markers:
  [from, to, source, destination, sender, receiver, beneficiary, counterparty, payer,
   parent, child, external, linked, related, other, target, origin, reference, funding,
   contra, sweep, error]

# Modifiers that pick out different values of the same quantity: lastPayment is not
# minimumPayment, availableBalance is not currentBalance.
exclusive_modifiers:
  [current, available, last, next, previous, original, minimum, maximum, past, pending, posted, total, foreign, settlement, switch]

# Of those, the ones whose absence also means a different value: a plain `amount` is not
# the `foreignAmount`, while a plain statement balance usually is the last statement's.
defining_modifiers: [foreign, original, available, minimum, maximum, total, pending, settlement, switch]

# Description/name hints that an integer amount is in minor units (cents).
minor_unit_markers: [cents, cent, minor units, minor unit, minorunits, pennies, smallest currency unit]

# Description/name hints that an integer is a Unix epoch.
epoch_markers: [epoch, unix, millis, milliseconds since, seconds since]


# Name roles take precedence over later prose mentioning other events.
meaning_rules:
  - group: transaction_event
    role: posted
    concepts: [date, timestamp]
    name_phrases: [posted, booking, booked]
    definition_phrases: [transaction was posted, entry is posted, transaction posted, posted to the account]
  - group: transaction_event
    role: authorized
    concepts: [date, timestamp]
    name_phrases: [authorized, authorised, authorization]
    definition_phrases: [transaction was authorized, transaction was authorised]
  - group: transaction_event
    role: settlement
    concepts: [date, timestamp]
    name_phrases: [value date, settlement]
    definition_phrases: [assets become available, funds become available]
  - group: transaction_event
    role: recorded
    concepts: [date, timestamp]
    name_phrases: [ingested, ingestion, recorded]
    definition_phrases: [added to the server, backend systems, server ingestion]
  - group: currency_standard
    role: unofficial
    concepts: [currency]
    name_phrases: [unofficial currency]
    definition_phrases: [unofficial currency]
  - group: currency_standard
    role: iso
    concepts: [currency]
    name_phrases: [iso currency]
    definition_phrases: [iso 4217, per iso]
  - group: value_kind
    role: identifier
    concepts: [identifier, name, payee, timestamp, date]
    name_phrases: [id, identifier]
    definition_phrases: [unique identifier, unique id]
  - group: value_kind
    role: name
    concepts: [identifier, name, payee, timestamp, date]
    name_phrases: [name]
    definition_phrases: [payee name, merchant name]
  - group: value_kind
    role: date
    concepts: [identifier, name, payee, timestamp, date]
    name_phrases: [timestamp, date, datetime]
    definition_phrases: [date and time, date the]
  - group: product_kind
    role: bank_product
    concepts: [product]
    name_phrases: []
    definition_phrases: [marketed product]
  - group: product_kind
    role: api_product
    concepts: [product]
    name_phrases: []
    definition_phrases: [products available for the item, products enabled for the item, products added to the item, products that have been billed for the item]
  - group: classification_system
    role: merchant_code
    concepts: [category, code, mcc]
    name_phrases: [merchant category code, mcc]
    definition_phrases: [mcc, sic, merchant category code]
  - group: classification_system
    role: proprietary_category
    concepts: [category, identifier, code]
    name_phrases: [category id, personal finance category, business finance category]
    definition_phrases: [id of the category]
  - group: classification_system
    role: system_name
    concepts: [category]
    name_phrases: []
    definition_phrases: [specifying the standard, classification standard name]
    require_source: true
  - group: classification_system
    role: payment_purpose
    concepts: [category, purpose, code]
    name_phrases: [category purpose code]
    definition_phrases: [type of purpose behind a transaction]
  - group: currency_role
    role: foreign
    concepts: [currency]
    name_phrases: [foreign]
    name_concepts: [foreign, currency]
    definition_phrases: [foreign currency]
    require_source: true
  - group: currency_role
    role: account
    concepts: [currency]
    name_phrases: [account currency, base currency]
    definition_phrases: [currency code of the transaction, currency code of the balance, currency in which the account]
  - group: account_number_representation
    role: masked
    concepts: [display, number, identifier]
    name_phrases: [account number display, masked number, mask, masked account number]
    name_concepts: [account, number, display]
    definition_phrases: [account display number, masked account number, last four digits of the account number]
    require_source: true
  - group: transaction_identity
    role: related_transaction
    concepts: [identifier, reference]
    name_concepts: [reference, transaction, identifier]
    name_phrases: []
    definition_phrases: [identity of the transaction being reversed, identity of the reversing post, identity of the authorization transaction, associated pending transaction]
    require_source: true

# Explicit purpose definitions, independent of field spelling. Unknown prose stays unknown.
purpose_rules:
  - group: status_subject
    role: account
    label: account status
    patterns:
      - '^(?:the\s+)?account\s+status\b'
      - '^specifies\s+the\s+status\s+of\s+(?:the\s+)?account\s+resource\b'
  - group: status_subject
    role: switch
    label: account switching status
    patterns:
      - '^specifies\s+the\s+switch\s+status\b'
  - group: identity_owner
    role: account
    label: account identity
    patterns:
      - '\b(?:bank\s+)?account\s+(?:identifier|identity)\b'
      - '\bidentifier\s+(?:assigned\s+to|of|for)\s+(?:the\s+)?(?:bank\s+)?account\b'
  - group: identity_owner
    role: request
    label: request correlation
    patterns:
      - '\b(?:request|caller.provided)\s+(?:correlation|tracking)\s+(?:token|identifier|id)\b'
      - '\bcorrelation\s+(?:token|identifier|id)\b[^.;]{0,80}\brequest\b'
      - '\bidentifier\s+generated\b[^.;]{0,80}\b(?:its\s+own|this)\s+request\b'
  - group: presentation
    role: product_label
    label: human-readable product name
    expects_labels: true
    patterns:
      - '\bhuman.readable\s+name\b[^.;]{0,60}\bproduct\b'
      - '\b(?:display|marketing)\s+name\b[^.;]{0,60}\bproduct\b'
      - '\bmarketed\s+product\s+name\b'
      - '\bofficial\s+name\s+of\s+(?:the\s+)?account\b'
  - group: presentation
    role: account_nickname
    label: account nickname or user-assigned account name
    patterns:
      - '\baccount\s+nickname\b'
      - '\bname\s+of\s+(?:the\s+)?account\b[^.;]{0,60}\bassigned\s+by\s+(?:the\s+)?user\b'
  - group: presentation
    role: product_identifier
    label: product identifier
    patterns:
      - '\b(?:id|identifier)\s+of\s+(?:the\s+)?marketed\s+product\b'
  - group: classification_code
    role: merchant_category
    label: merchant category code (MCC)
    patterns:
      - '\bmerchant\s+category\s+code\b'
      - '\bmcc\b'
  - group: origin
    role: upstream_generated
    label: generated by the upstream service
    patterns:
      - '\b(?:identifier|id|value)\s+generated\s+by\s+(?:the\s+)?upstream\s+(?:service|api)\b'
