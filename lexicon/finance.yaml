# Finance domain lexicon. Everything "semantic" the matcher knows comes from this file.
# Tokens are lower-case words produced by splitting identifiers (camelCase, snake_case, dots).
#
# Processing order for a field name:
#   split -> singularize -> abbreviations -> phrases -> synonyms -> drop stopwords

