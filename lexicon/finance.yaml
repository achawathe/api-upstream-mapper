# Concepts that are close but not identical. Score is how much partial credit a pairing earns.
related:
  - [identifier, reference, 0.6]
  - [identifier, number, 0.4]
  - [identifier, code, 0.5]
  - [current, posted, 0.5]
  - [transaction, entry, 0.9]
  - [transaction, transfer, 0.3]
  - [timestamp, date, 0.75]
  - [previous, last, 0.9]
  - [customer, holder, 0.7]
  - [payee, merchant, 0.8]
  - [payee, counterparty, 0.7]
  - [description, name, 0.4]
  - [rate, apr, 0.6]
  - [type, category, 0.5]
  - [balance, amount, 0.5]
  - [limit, line, 0.4]
  - [institution, routing, 0.5]
  - [bank, routing, 0.5]
  - [due, next, 0.5]
  - [network, type, 0.4]
  - [display, number, 0.5]
