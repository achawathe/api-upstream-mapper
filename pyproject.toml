[project]
name = "api-mapper"
version = "0.1.0"
description = "Deterministic field mapper from downstream API specs to an upstream API spec"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdf>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
nlp = ["sentence-transformers>=3.0,<6"]

[project.scripts]
api-mapper = "api_mapper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api_mapper = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
